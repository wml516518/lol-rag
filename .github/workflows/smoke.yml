name: Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # 每天 09:00 Asia/Shanghai
  push:
    branches: [main]
    paths:
      - scripts/smoke_test.py
      - .github/workflows/smoke.yml

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install httpx
        run: python -m pip install --upgrade pip httpx

      - name: Smoke test live services
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://lol-rag.netlify.app' }}
          API_URL: ${{ vars.API_URL || 'https://lol-rag-api.onrender.com' }}
        run: python scripts/smoke_test.py
